name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      force:
        description: Выпустить, даже если релиз этой версии уже существует
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  prepare:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      should_release: ${{ steps.decide.outputs.should_release }}
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=<Version>).*(?=</Version>)' Directory.Build.props | head -1)
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Directory.Build.props: непригодная версия «$VERSION»"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Decide if release is needed
        id: decide
        shell: bash
        run: |
          if [[ "${{ inputs.force }}" == "true" ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif ! gh release view "v${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: prepare
    if: >
      needs.prepare.outputs.should_release == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: SpaceSnoop
            project: SpaceSnoop.Wpf/SpaceSnoop.Wpf.csproj
            binary: SpaceSnoop.Wpf.exe
            asset: SpaceSnoop
          - edition: Classic
            project: SpaceSnoop/SpaceSnoop.csproj
            binary: SpaceSnoop.exe
            asset: SpaceSnoop-Classic

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            packages/**/*.nupkg

      - name: Verify lock files
        run: dotnet restore SpaceSnoop.sln --locked-mode

      - name: Publish (framework-dependent)
        run: >
          dotnet publish ${{ matrix.project }}
          --configuration Release
          --runtime win-x64
          --output .\publish\framework-dependent
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:Version=${{ needs.prepare.outputs.version }}
          --no-self-contained

      - name: Publish (portable / self-contained)
        run: >
          dotnet publish ${{ matrix.project }}
          --configuration Release
          --runtime win-x64
          --output .\publish\portable
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ needs.prepare.outputs.version }}
          --self-contained

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $asset = "${{ matrix.asset }}"
          $binary = "${{ matrix.binary }}"
          $version = "${{ needs.prepare.outputs.version }}"

          Move-Item ".\publish\framework-dependent\$binary" ".\dist\$asset-v$version.exe"
          Compress-Archive -Path ".\dist\$asset-v$version.exe" -DestinationPath ".\dist\$asset-v$version.zip"

          Move-Item ".\publish\portable\$binary" ".\publish\portable\$asset-v$version-portable.exe"
          Compress-Archive -Path ".\publish\portable\$asset-v$version-portable.exe" -DestinationPath ".\dist\$asset-v$version-portable.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          retention-days: 1

  publish:
    needs: [ prepare, build ]
    if: >
      needs.prepare.outputs.should_release == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- *.exe *.zip > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Render release body
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          REPO="${{ github.server_url }}/${{ github.repository }}"
          SLUG="${{ github.repository }}"
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)

          {
            sed -e "s|__VERSION__|$VERSION|g" -e "s|__REPO__|$REPO|g" -e "s|__SLUG__|$SLUG|g" .github/release-body.md
            echo
            echo "## Изменения"
            echo
            git log --no-merges --pretty='- %s' "${PREV:+$PREV..}HEAD" | grep -v '^- Версия ' || true
            if [ -n "$PREV" ]; then
              echo
              echo "**Полный список:** $REPO/compare/$PREV...v$VERSION"
            fi
          } > release-body.rendered.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: SpaceSnoop v${{ needs.prepare.outputs.version }}
          files: dist/*
          body_path: release-body.rendered.md

  status:
    needs: [ prepare, build, publish ]
    if: always() && needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write

    steps:
      - name: Report status on commit
        shell: bash
        run: |
          if [[ "${{ needs.publish.result }}" == "success" ]]; then
            STATE=success
            DESCRIPTION="v${{ needs.prepare.outputs.version }} опубликован"
          else
            STATE=failure
            DESCRIPTION="Релиз v${{ needs.prepare.outputs.version }} не собран"
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ needs.prepare.outputs.sha }}" \
            -f state="$STATE" \
            -f context=Release \
            -f description="$DESCRIPTION" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
