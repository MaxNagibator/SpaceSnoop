name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Select tag of release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: ./SpaceSnoop

    steps:
      - uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Publish
        run: |
          dotnet publish --configuration Release --runtime win-x64 -p:PublishSingleFile=true -p:PublishReadyToRun=true --no-self-contained
          powershell Compress-Archive .\bin\Release\net9.0-windows\win-x64\publish\SpaceSnoop.exe SpaceSnoop.zip

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}" .\bin\Release\net9.0-windows\win-x64\publish\SpaceSnoop.exe SpaceSnoop.zip
