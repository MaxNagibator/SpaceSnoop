name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      should_release: ${{ steps.decide.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=<Version>).*(?=</Version>)' Directory.Build.props)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Decide if release is needed
        id: decide
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif ! gh release view "v${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore SpaceSnoop.sln --locked-mode

      - name: Build
        run: dotnet build SpaceSnoop.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test SpaceSnoop.sln
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults
          --blame-hang
          --blame-hang-timeout 60s

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: TestResults/**
          retention-days: 5

  build:
    needs: [ prepare, test ]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: SpaceSnoop
            project: SpaceSnoop.Wpf/SpaceSnoop.Wpf.csproj
            binary: SpaceSnoop.Wpf.exe
            asset: SpaceSnoop
          - edition: Classic
            project: SpaceSnoop/SpaceSnoop.csproj
            binary: SpaceSnoop.exe
            asset: SpaceSnoop-Classic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Publish (framework-dependent)
        run: >
          dotnet publish ${{ matrix.project }}
          --configuration Release
          --runtime win-x64
          --output .\publish\framework-dependent
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:Version=${{ needs.prepare.outputs.version }}
          --no-self-contained

      - name: Publish (portable / self-contained)
        run: >
          dotnet publish ${{ matrix.project }}
          --configuration Release
          --runtime win-x64
          --output .\publish\portable
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ needs.prepare.outputs.version }}
          --self-contained

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $asset = "${{ matrix.asset }}"
          $binary = "${{ matrix.binary }}"
          $version = "${{ needs.prepare.outputs.version }}"

          Move-Item ".\publish\framework-dependent\$binary" ".\dist\$asset-v$version.exe"
          Compress-Archive -Path ".\dist\$asset-v$version.exe" -DestinationPath ".\dist\$asset-v$version.zip"

          Move-Item ".\publish\portable\$binary" ".\publish\portable\$asset-v$version-portable.exe"
          Compress-Archive -Path ".\publish\portable\$asset-v$version-portable.exe" -DestinationPath ".\dist\$asset-v$version-portable.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          retention-days: 1

  publish:
    needs: [ prepare, build ]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- *.exe *.zip > SHA256SUMS.txt

      - name: Render release body
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          REPO="${{ github.server_url }}/${{ github.repository }}"
          SLUG="${{ github.repository }}"
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)

          {
            sed -e "s|__VERSION__|$VERSION|g" -e "s|__REPO__|$REPO|g" -e "s|__SLUG__|$SLUG|g" .github/release-body.md
            echo
            echo "## Изменения"
            echo
            git log --no-merges --pretty='- %s' "${PREV:+$PREV..}HEAD" | grep -v '^- Версия ' || true
            if [ -n "$PREV" ]; then
              echo
              echo "**Полный список:** $REPO/compare/$PREV...v$VERSION"
            fi
          } > release-body.rendered.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: SpaceSnoop v${{ needs.prepare.outputs.version }}
          files: dist/*
          body_path: release-body.rendered.md
