name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      should_release: ${{ steps.decide.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=<Version>).*(?=</Version>)' Directory.Build.props)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag if needed
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          if ! git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.VERSION }}" | grep -q .; then
            git tag "v${{ steps.version.outputs.VERSION }}"
            git push origin "v${{ steps.version.outputs.VERSION }}"
          fi

      - name: Decide if release is needed
        id: decide
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif ! gh release view "v${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: SpaceSnoop
            project: SpaceSnoop.Wpf/SpaceSnoop.Wpf.csproj
            binary: SpaceSnoop.Wpf.exe
            asset: SpaceSnoop
          - edition: Classic
            project: SpaceSnoop/SpaceSnoop.csproj
            binary: SpaceSnoop.exe
            asset: SpaceSnoop-Classic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Publish (framework-dependent)
        run: >
          dotnet publish ${{ matrix.project }}
          --configuration Release
          --runtime win-x64
          --output .\publish\framework-dependent
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:Version=${{ needs.prepare.outputs.version }}
          --no-self-contained

      - name: Publish (portable / self-contained)
        run: >
          dotnet publish ${{ matrix.project }}
          --configuration Release
          --runtime win-x64
          --output .\publish\portable
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ needs.prepare.outputs.version }}
          --self-contained

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $asset = "${{ matrix.asset }}"
          $binary = "${{ matrix.binary }}"
          $version = "${{ needs.prepare.outputs.version }}"

          Move-Item ".\publish\framework-dependent\$binary" ".\dist\$asset-v$version.exe"
          Compress-Archive -Path ".\dist\$asset-v$version.exe" -DestinationPath ".\dist\$asset-v$version.zip"

          Move-Item ".\publish\portable\$binary" ".\publish\portable\$asset-v$version-portable.exe"
          Compress-Archive -Path ".\publish\portable\$asset-v$version-portable.exe" -DestinationPath ".\dist\$asset-v$version-portable.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          retention-days: 1

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release body template
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-body.md
          sparse-checkout-cone-mode: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render release body
        shell: bash
        run: |
          sed -e "s|__VERSION__|${{ needs.prepare.outputs.version }}|g" \
              -e "s|__REPO__|${{ github.server_url }}/${{ github.repository }}|g" \
              .github/release-body.md > release-body.rendered.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: SpaceSnoop v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: dist/*
          body_path: release-body.rendered.md
